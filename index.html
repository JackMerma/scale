<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo: objeto con escala por profundidad (Depth Anything V2)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage">
    <div id="canvasCard">
      <canvas id="c"></canvas>
    </div>

    <div id="hud" class="panel">click / arrastra para colocar el objeto</div>

    <div id="controls" class="panel">
      <div id="modeSwitch">
        <label><input type="radio" name="mode" id="modeCube" value="cube" checked> cubo</label>
        <label><input type="radio" name="mode" id="modeProduct" value="product"> imagen de producto</label>
      </div>
      <label><input type="checkbox" id="toggleDepth"> ver mapa de profundidad <kbd>D</kbd></label>
      <label><input type="checkbox" id="toggleVP" checked> ver punto de fuga <kbd>V</kbd></label>
      <label><input type="checkbox" id="toggleAxes" checked> ver ejes <kbd>A</kbd></label>
      <label id="scaleLabel">
        escala: <span id="scaleValue">1.00x</span>
        <input type="range" id="cubeScale" min="0.3" max="3" step="0.05" value="1">
      </label>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
